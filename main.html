            font-family: Arial, sans-serif;

            font-weight: bold;        /* Pogrubienie czcionki */
            letter-spacing: 1px;      /* Drobne, eleganckie rozstrzelenie liter */
        }
        .gifeek {
            display: block;
            margin: 0 auto 20px auto; /* Centruje gifa i daje 20px odstępu od kontenera poniżej */

            height: auto;             /* Zachowuje proporcje */
        }
        .quiz-container {
            text-align: center;
            background: #CBD1D4;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0px 12px rgba(0,0,0,0.5);
            max-width: 90vw;
            width: 800px;
            box-sizing: border-box;
        }
        img {
            display: block;
            margin: 0 auto 15px auto;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        /* Stylizacja bloku kodu */
        pre {
            background-color: #EAEEF3;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            overflow-x: auto;
            margin: 15px 0;
            width: 100%;              /* Kod zajmuje dokładnie tyle miejsca, ile daje mu kontener (czyli szerokość zdjęcia) */
            box-sizing: border-box;
            overflow-x: auto;         /* Jeśli linijka kodu będzie szersza niż zdjęcie, pojawi się scrollbar zamiast rozpychania ramki */
            margin: 15px 0;
            border: 1px solid #e1e4e8;
        }
        code {
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1;
            background: transparent !important;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="number"] {
            margin-top: 20px; 
            font-size: 12px !important;
            padding: 10px;
            width: 50%;
            height: 1px;
            border: none;
            border-bottom: 2px solid #697A86;
            outline: none;
            text-align: center;
            font-size: 16px;
            background: transparent;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }       
        input[type="number"]::placeholder {
            color: #697A86;           /* Szary kolor napisu "Tutaj wpisz rozwiązanie." */
            font-size: 12px;
        }
        button {
            padding: 10px 15px;
            background-color: #CBD1D4;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .przyciski-dolne-kontener {
            margin-top: 20px;         /* Daje 20px wolnej przestrzeni między białą ramką a przyciskiem */
            text-align: center;       /* Centruje przyciski w poziomie */
            width: 100%;
        }
        .przyciski-dolne-kontener button {
            width: 800px;
            height: 18px;
            max-width: 95vw;          /* Żeby na telefonie nie wystawał */
            box-sizing: border-box;
            box-shadow: 0 0px 12px rgba(0,0,0,0.5);
            padding: 0px;            /* Nieco grubszy, wygodniejszy przycisk */
        }
        .przyciski-dolne-kontener button:hover {
            box-shadow: 0 0px 12px rgba(0,0,0,1);
        }
        #wynik {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        .poprawna { color: green; }
        .bledna { color: red; }
        .hidden { display: none; }

            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #000000;           /* Delikatny szary kolor */
            letter-spacing: 1.5px;    /* Eleganckie rozstrzelenie liter */

            text-align: center;         /* Wyównanie do lewej (możesz zmienić na center) */

    let aktualnePytanie = null;

    function losujPytanie() {
        document.getElementById('wynik').innerHTML = '';
        document.getElementById('odpowiedz-uzytkownika').value = '';
        document.getElementById('przycisk-nastepny').classList.add('hidden');
        document.getElementById('przycisk-sprawdz').disabled = false;
        document.getElementById('odpowiedz-uzytkownika').disabled = false;

        const losowyIndeks = Math.floor(Math.random() * bazaPytan.length);
        const numerAktualny = losowyIndeks + 1;
        aktualnePytanie = bazaPytan[losowyIndeks];

        // Podmiana zdjęcia i kodu
        document.getElementById('numer-zadania').innerHTML = `Zadanie nr. ${numerAktualny} | Rozwiązania: <a href="https://discord.gg/8MDaMs5nS3">https://discord.gg/8MDaMs5nS3`;
        document.getElementById('losowy-obrazek').src = aktualnePytanie.src;
        const elementKodu = document.getElementById('kod-zadania');
        elementKodu.textContent = aktualnePytanie.kod;
        hljs.highlightElement(elementKodu);
    }

    function sprawdzOdpowiedz() {
        const wpisanaOdpowiedz = parseFloat(document.getElementById('odpowiedz-uzytkownika').value);
        const kontenerWyniku = document.getElementById('wynik');

        if (isNaN(wpisanaOdpowiedz)) {
            kontenerWyniku.className = "bledna";
            kontenerWyniku.innerHTML = "Wpisz poprawną liczbę!";
            return;
        }

        const prawidlowaOdpowiedz = aktualnePytanie.odp;
        const tolerancja = Math.abs(prawidlowaOdpowiedz / 20);
        const roznica = Math.abs(wpisanaOdpowiedz - prawidlowaOdpowiedz);

        if (roznica <= tolerancja) {
            kontenerWyniku.className = "poprawna";
            kontenerWyniku.innerHTML = `Dobrze! Twój wynik: ${wpisanaOdpowiedz} (Idealnie: ${prawidlowaOdpowiedz} ±${tolerancja})`;
        } else {
            kontenerWyniku.className = "bledna";
            kontenerWyniku.innerHTML = `Źle! Prawidłowa odpowiedź to: ${prawidlowaOdpowiedz} (±${tolerancja})`;
        }

        document.getElementById('przycisk-sprawdz').disabled = true;
        document.getElementById('odpowiedz-uzytkownika').disabled = true;
        document.getElementById('przycisk-nastepny').classList.remove('hidden');
    }

    window.onload = losujPytanie;
</script>
